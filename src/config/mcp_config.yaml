# config/mcp_config.yaml
mcp_servers:
  document_tools:
    command: "python"
    args: ["-m", "mcp_servers.document_tools"]
    env:
      DOCUMENT_STORE_PATH: "./data/documents"
llm:
  model: "gpt-4-turbo-preview"
  temperature: 0.1
  max_tokens: 4000

workflow:
  max_parallel_steps: 3
  default_confidence_threshold: 0.8
  retry_attempts: 2